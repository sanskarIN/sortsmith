[workspace]
members = ["crates/sortsmith-core", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"
authors = ["Sanskar <sanskarin@outlook.in>"]
repository = "https://github.com/sanskarIN/sortsmith"

[workspace.dependencies]
anyhow = "1.0"
blake3 = "1.8"
chrono = { version = "0.4", features = ["serde"] }
criterion = "0.8.2"
mime_guess = "2.0"
proptest = "1.11.0"
rayon = "1.11"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.21"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
walkdir = "2.5"

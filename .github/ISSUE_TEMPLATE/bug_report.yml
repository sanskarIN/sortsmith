name: Bug report
description: Report a reproducible SortSmith problem
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Please remove personal filenames/paths from screenshots and logs.
  - type: input
    id: version
    attributes: { label: SortSmith version }
    validations: { required: true }
  - type: dropdown
    id: os
    attributes: { label: Operating system, options: [Windows, macOS, Linux] }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Reproduction steps }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: Expected behavior }
    validations: { required: true }
  - type: textarea
    id: actual
    attributes: { label: Actual behavior }
    validations: { required: true }

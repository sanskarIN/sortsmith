name: Feature request
description: Suggest a coherent SortSmith improvement
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes: { label: Problem, description: What user problem should this solve? }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed behavior }
    validations: { required: true }
  - type: textarea
    id: safety
    attributes: { label: Filesystem safety considerations, description: Explain preview, undo, permissions, or privacy implications if relevant. }

version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule: { interval: weekly }
    groups:
      rust-minor: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: "/apps/desktop"
    schedule: { interval: weekly }
    groups:
      frontend-minor: { patterns: ["*"] }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }

name: Release preparation

on:
  push:
    branches:
      - 'release/0.1.8'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/0.1.8
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format Rust sources
        run: cargo fmt --all

      - name: Generate frontend lockfile
        working-directory: apps/desktop
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: Commit preparation changes
        run: |
          if git diff --quiet; then
            echo "Release branch is already prepared."
            exit 0
          fi
          git config user.name "Sanskar"
          git config user.email "sanskarin@outlook.in"
          git add --all
          git commit -m "style(release): format Rust and lock frontend dependencies"
          git push origin HEAD:release/0.1.8
